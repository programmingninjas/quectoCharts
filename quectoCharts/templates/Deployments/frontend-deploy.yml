apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deploy
  namespace: {{ .Values.namespace }}
  labels:
    name: frontend-deploy
    app: {{ .Values.appName }}
spec:
  replicas: {{ .Values.replicas.frontend }}
  selector:
    matchLabels:
      name: frontend-pod
      app: {{ .Values.appName }}
  template:
    metadata:
      name: frontend-pod
      labels:
        name: frontend-pod
        app: {{ .Values.appName }}
    spec:
      containers:
      - name: frontend
        image: "{{ .Values.images.frontend_image.name }}:{{ .Values.images.frontend_image.tag }}"
        requests:
          cpu: "100m"       
          memory: "256Mi"  
        limits:
          cpu: "500m"        
          memory: "512Mi"   
        envFrom:
         - configMapRef:
             name: frontend-config
        ports:
        - containerPort: 80
